<body>
<div class="app"><div class="wrap">
<header class="top"><div class="brand"><div class="logo">📚</div><div><h1>成語闖關王</h1><p>國小五、六年級・考前總複習</p></div></div><div class="pill">✨ 54 個成語・64 題總複習</div></header>
<section id="home" class="hero"><div class="hero-grid"><div><div class="eyebrow">IDIOM QUEST · LEVEL UP</div><h2>用成語解鎖<br><span>你的語文力！</span></h2><p>一次複習資料中的 54 個成語，挑戰選擇與填空題。每題答完都會看到解釋，錯了也能學會；每次重新開始，題目順序都會重新洗牌。</p><button id="start" class="btn primary">開始闖關　→</button></div><div class="hero-art" aria-label="書本與星星插圖">📖🌟</div></div><div class="stats"><div class="stat"><strong>64</strong><small>道複習題</small></div><div class="stat"><strong>54</strong><small>個資料成語</small></div><div class="stat"><strong>64</strong><small>滿分</small></div></div></section>
<section id="game" class="hidden"><div class="game-head"><div><div class="step-label" id="step">第 1 / 64 題</div><div class="progress"><div id="bar"></div></div></div><div class="score">⭐ <span id="score">0</span> 分</div></div><div class="q-card"><span class="type-chip" id="type">選擇題</span><h2 class="q-title" id="question"></h2><p class="q-sub" id="sub"></p><div id="answer-area"></div><div id="feedback" class="feedback hidden" aria-live="polite"></div><div class="bottom"><span class="hint" id="hint">仔細閱讀題目，再選出答案。</span><button id="next" class="btn primary hidden">下一題　→</button></div></div></section>
<section id="result" class="hero hidden"><div class="result"><div class="medal" id="medal">🏆</div><div class="eyebrow">MISSION COMPLETE</div><h2 id="result-title">闖關成功！</h2><p>每一次作答，都是讓語文能力更進步的機會。</p><div class="final-score"><span id="final-score">0</span><small style="font-size:20px"> / 64</small></div><p id="result-message"></p><button id="restart" class="btn primary">再挑戰一次 ↻</button></div><div class="review"><h3>📘 本次學習回顧</h3><div id="review-list"></div></div></section>

<script>
let questions = [
{type:'choice',q:'「畫蛇添足」的意思是什麼？',sub:'選出最適合的解釋。',opts:['做了多餘的事，反而把事情弄糟','做事十分迅速，從不拖延','遇到困難仍然勇往直前','畫畫技巧非常高超'],a:0,why:'比喻做了多餘的事，反而有害無益。例句：這篇文章已經很完整，再加一段反而畫蛇添足。'},
{type:'choice',q:'看到同學遇到困難，大家一起幫忙，真是「＿＿」。',sub:'選出最符合情境的成語。',opts:['自相矛盾','雪中送炭','守株待兔','井底之蛙'],a:1,why:'「雪中送炭」比喻在別人急需時給予幫助。'},
{type:'choice',q:'「井底之蛙」通常用來形容怎樣的人？',sub:'想一想青蛙為什麼看不見廣大的世界。',opts:['勇敢探索未知的人','見識狹窄、眼界不廣的人','做事小心謹慎的人','非常樂於助人的人'],a:1,why:'比喻見識狹窄、眼光短淺的人。'},
{type:'choice',q:'下列哪個成語形容「說話或做事前後不一致」？',sub:'辨認成語的核心意思。',opts:['一舉兩得','自相矛盾','全力以赴','持之以恆'],a:1,why:'「自相矛盾」指自己的言語或行為互相抵觸。'},
{type:'choice',q:'「他每天練習朗讀，從不輕易放棄，終於進步很多。」最適合哪個成語？',sub:'選出最能表現堅持精神的成語。',opts:['半途而廢','坐井觀天','持之以恆','狐假虎威'],a:2,why:'「持之以恆」指長久堅持下去，不間斷。'},
{type:'choice',q:'「亡羊補牢」的啟示最接近哪一項？',sub:'從故事中想一想可以學到什麼。',opts:['犯錯後及時改正，還不算晚','事情成功後就不必努力','遇到問題應該假裝沒看見','只要運氣好就能成功'],a:0,why:'比喻出了差錯後，及時補救，仍可避免更大的損失。'},
{type:'choice',q:'妹妹把事情的來龍去脈說得很清楚，可以用哪個成語形容？',sub:'選出形容表達清楚、有條理的成語。',opts:['亂七八糟','一知半解','有條不紊','狼吞虎嚥'],a:2,why:'「有條不紊」形容有條理、有次序，一點也不紊亂。'},
{type:'choice',q:'「杯弓蛇影」形容一個人怎麼了？',sub:'注意這個成語和「疑神疑鬼」的關係。',opts:['因疑神疑鬼而自相驚擾','做事非常有把握','遇到事情冷靜分析','喜歡幫助別人'],a:0,why:'比喻因疑神疑鬼而引起恐懼或不安。'},
{type:'choice',q:'大家分工合作，一起完成布置教室的任務，最適合哪個成語？',sub:'想想團隊合作的力量。',opts:['各自為政','同心協力','孤掌難鳴','自作自受'],a:1,why:'「同心協力」指大家一條心，共同努力。'},
{type:'choice',q:'「他對這件事只知道一點點，卻說得好像什麼都懂。」可以用哪個成語？',sub:'選出形容了解不深的成語。',opts:['融會貫通','舉一反三','一知半解','出口成章'],a:2,why:'「一知半解」指知道得不全面，理解得不透徹。'},
{type:'fill',q:'請完成成語：守＿＿待兔',sub:'輸入缺少的那一個字。',answers:['株'],display:'守（　）待兔',why:'「守株待兔」比喻不主動努力，只存著僥倖心理，期待意外收穫。'},
{type:'fill',q:'請完成成語：迫不及＿＿',sub:'輸入缺少的那一個字。',answers:['待'],display:'迫不及（　）',why:'「迫不及待」形容心情急切，等不及。'},
{type:'fill',q:'請完成成語：名＿＿其實',sub:'輸入缺少的那一個字。',answers:['副'],display:'名（　）其實',why:'「名副其實」指名稱或名聲與實際相符合。'},
{type:'fill',q:'請完成成語：再接再＿＿',sub:'輸入缺少的那一個字。',answers:['厲'],display:'再接再（　）',why:'「再接再厲」比喻一次又一次繼續努力。'},
{type:'fill',q:'請完成成語：恍然大＿＿',sub:'輸入缺少的那一個字。',answers:['悟'],display:'恍然大（　）',why:'「恍然大悟」形容一下子明白、醒悟過來。'},
{type:'match',q:'請為「一舉兩得」找到正確解釋。',sub:'配對任務：點選最符合這個成語意思的卡片。',opts:['做一件事得到兩方面的好處','形容非常勤奮努力','形容人很多、非常熱鬧','比喻事情已經無法挽回'],a:0,why:'「一舉兩得」指做一件事，同時得到兩種好處。'},
{type:'match',q:'請為「滔滔不絕」找到正確解釋。',sub:'配對任務：選出這個成語的意思。',opts:['形容說話連續不斷','形容做事猶豫不決','形容景色十分美麗','形容非常害怕、不敢前進'],a:0,why:'「滔滔不絕」形容話很多，連續不斷地說。'},
{type:'match',q:'請為「大器晚成」找到正確解釋。',sub:'配對任務：選出這個成語的意思。',opts:['有才能的人往往較晚有所成就','做事一定要搶第一','器具使用很久才會壞','年紀大了就不能學習'],a:0,why:'「大器晚成」比喻卓越的人才往往需要較長時間才能成就。'},
{type:'match',q:'請為「未雨綢繆」找到正確解釋。',sub:'配對任務：選出這個成語的意思。',opts:['事先做好準備，預防可能發生的問題','下雨天把衣服收進屋裡','事情發生後才開始抱怨','遇到困難就立刻放棄'],a:0,why:'「未雨綢繆」比喻事先做好準備，以防患未然。'},
{type:'match',q:'請為「見賢思齊」找到正確解釋。',sub:'配對任務：選出這個成語的意思。',opts:['看見有德行或才能的人，就想向他學習','看見別人成功就嫉妒','只相信自己的想法','大家的能力都完全相同'],a:0,why:'「見賢思齊」指看見賢能的人，就希望向他看齊、學習。'}
];
questions = [
{type:'choice',q:'「搖頭晃腦」在資料中形容什麼？',sub:'依照成語整理資料作答。',opts:['頭搖來搖去，形容自以為是或自得其樂','心思不集中','說話從容不迫','舉止言談不自然'],a:0,why:'搖頭晃腦：頭搖來搖去。形容自以為是或自得其樂。'},
{type:'choice',q:'在專家面前賣弄本事、不自量力，是哪個成語？',sub:'選出正確成語。',opts:['班門弄斧','含血噴人','侃侃而談','一哄而散'],a:0,why:'班門弄斧：比喻在行家面前賣弄本事，不自量力。'},
{type:'choice',q:'「情真意摯」的意思是什麼？',sub:'選出正確解釋。',opts:['情感真切、心意誠摯','情緒不穩、沉不住氣','心胸寬闊、度量宏大','毫無辦法可想'],a:0,why:'情真意摯：情感真切、心意誠摯；反義詞是虛情假意。'},
{type:'choice',q:'物品無故遺失，可以用哪個成語？',sub:'選出最符合的成語。',opts:['不翼而飛','一箭雙雕','沙裡淘金','坦腹東床'],a:0,why:'不翼而飛：比喻物品無故遺失。'},
{type:'choice',q:'「含血噴人」比喻什麼？',sub:'選出正確解釋。',opts:['捏造事實，誣賴他人','一再叮嚀囑咐','探索玄妙隱微的事理','從大量材料中擷取精華'],a:0,why:'含血噴人：比喻捏造事實，誣賴他人；近義詞是血口噴人。'},
{type:'choice',q:'「儲精蓄銳」的意思是什麼？',sub:'選出正確解釋。',opts:['保養精神，積蓄力量','輕視、瞧不起','做事切實穩健','少見而怪異'],a:0,why:'儲精蓄銳：保養精神，積蓄力量。'},
{type:'choice',q:'雖然有困難，仍努力去做，稱為什麼？',sub:'依照資料中的解釋作答。',opts:['勉為其難','無可奈何','執迷不悟','捉襟見肘'],a:0,why:'勉為其難：雖然在事實上有所困難，但仍努力去做。'},
{type:'choice',q:'「赴湯蹈火」比喻什麼？',sub:'選出正確解釋。',opts:['奮不顧身，不避艱險','缺乏根據且不必要的憂慮','形容非常貪饞','遵循舊規'],a:0,why:'赴湯蹈火：比喻奮不顧身，不避艱險；近義詞是奮不顧身。'},
{type:'choice',q:'「根深蒂固」形容什麼？',sub:'選出正確解釋。',opts:['根基堅固，不可動搖','尷尬難堪的樣子全都暴露','心情急切，不願等待','家境極為貧困'],a:0,why:'根深蒂固：比喻根基堅固，不可動搖。'},
{type:'choice',q:'「執迷不悟」形容怎樣的情況？',sub:'選出正確解釋。',opts:['堅持錯誤的觀念而不醒悟','看見別人就想向他學習','主動承擔應做的事','一舉達成兩個目標'],a:0,why:'執迷不悟：堅持錯誤的觀念而不醒悟；反義詞是懸崖勒馬。'},
{type:'choice',q:'冤屈無法申訴辯白，可以用哪個成語？',sub:'選出符合解釋的成語。',opts:['百口莫辯','慷慨解囊','感激涕零','初出茅廬'],a:0,why:'百口莫辯：比喻冤屈無法申訴辯白。'},
{type:'choice',q:'「民胞物與」比喻什麼？',sub:'選出正確解釋。',opts:['視人民如同胞、視動物如同類，形容博愛','輕財仗義，捐助錢財','對腐敗社會現狀的痛恨','只會盲目跟從他人'],a:0,why:'民胞物與：視人民如同胞，視動物如同類。比喻博愛。'},

let order=[],idx=0,score=0,answered=false,records=[];
const $=id=>document.getElementById(id);const shuffle=a=>{let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
function startGame(){order=shuffle(questions.map((_,i)=>i));idx=0;score=0;records=[];$('score').textContent=score;$('home').classList.add('hidden');$('result').classList.add('hidden');$('game').classList.remove('hidden');render()}
function render(){answered=false;const q=questions[order[idx]];$('step').textContent=`第 ${idx+1} / ${questions.length} 題`;$('bar').style.width=`${idx/questions.length*100}%`;$('type').textContent=q.type==='choice'?'🧠 選擇挑戰':q.type==='fill'?'✍️ 成語填空':'🧩 成語配對';$('question').textContent=q.q;$('sub').textContent=q.sub;$('feedback').className='feedback hidden';$('feedback').textContent='';$('next').classList.add('hidden');$('hint').textContent='答對得 1 分，看看解析加深記憶！';const area=$('answer-area');area.innerHTML='';
if(q.type==='fill'){const row=document.createElement('div');row.className='fill-row';const input=document.createElement('input');input.id='fill-answer';input.placeholder=q.display||'輸入缺少的字';input.setAttribute('aria-label','填入成語缺少的字');input.maxLength=8;const btn=document.createElement('button');btn.className='btn primary';btn.textContent='確認答案';btn.onclick=()=>checkFill(input.value);input.addEventListener('keydown',e=>{if(e.key==='Enter')checkFill(input.value)});row.append(input,btn);area.append(row);input.focus();}else{const opts=shuffle(q.opts.map((t,i)=>({t,correct:i===q.a})));const grid=document.createElement('div');grid.className='options';opts.forEach((o,i)=>{const b=document.createElement('button');b.className='option';b.innerHTML=`<span class="letter">${String.fromCharCode(65+i)}</span><span>${o.t}</span>`;b.onclick=()=>checkChoice(o.correct,b,grid);grid.append(b)});area.append(grid)} }
function giveFeedback(ok,q){answered=true;if(ok)score+=1;$('score').textContent=score;const f=$('feedback');f.className='feedback'+(ok?'':' bad');f.innerHTML=`<strong>${ok?'🎉 答對了！ +1 分':'💡 再記一下！'}</strong>${q.why}`;$('next').textContent=idx===questions.length-1?'查看闖關成績　🏆':'下一題　→';$('next').classList.remove('hidden');$('hint').textContent=ok?'太棒了，繼續保持！':'沒關係，記住解釋，下次就會更熟悉。';records.push({q:q.q,ok,why:q.why})}
function checkChoice(ok,btn,grid){if(answered)return;const q=questions[order[idx]];grid.querySelectorAll('button').forEach(b=>b.disabled=true);if(ok)btn.classList.add('correct');else{btn.classList.add('wrong');grid.querySelectorAll('.option').forEach(b=>{if(b.textContent.includes(q.opts[q.a]))b.classList.add('correct')})}giveFeedback(ok,q)}
function checkFill(value){if(answered)return;const q=questions[order[idx]];const v=value.trim().replace(/[，。！？、\s]/g,'');const ok=q.answers.some(a=>a===v);$('fill-answer').disabled=true;$('answer-area').querySelector('button').disabled=true;giveFeedback(ok,q)}
function nextQuestion(){if(!answered)return;if(idx<questions.length-1){idx++;render()}else showResult()}
function showResult(){$('game').classList.add('hidden');$('result').classList.remove('hidden');$('bar').style.width='100%';$('final-score').textContent=score;const pct=score/questions.length;$('medal').textContent=pct>=.9?'🏆':pct>=.7?'🥇':pct>=.5?'🌟':'🌱';$('result-title').textContent=pct>=.9?'成語達人！':pct>=.7?'闖關高手！':pct>=.5?'進步小勇士！':'學習冒險家！';$('result-message').textContent=`本次 54 個成語、${questions.length} 題總複習，你答對 ${score} 題。${pct>=.8?'表現很棒！繼續把成語用在生活和寫作中。':'再看一次解析、重新挑戰，就能一步步進步！'}`;const list=$('review-list');list.innerHTML='';records.forEach((r,i)=>{const d=document.createElement('details');const s=document.createElement('summary');s.textContent=`${r.ok?'✅':'📌'} ${i+1}. ${r.q}`;const p=document.createElement('p');p.textContent=r.why;d.append(s,p);list.append(d)})}
$('start').addEventListener('click',startGame);$('next').addEventListener('click',nextQuestion);$('restart').addEventListener('click',startGame);
</script>
</body>
